    <style>
        body { 
            background-color: #f4f1ea !important; /* สีครีมถนอมสายตา */

            padding: 30px; 
            line-height: 1.8; 
            color: #2c2924 !important; /* สีเทาเข้ม อ่านนานไม่ปวดตา */
        }
        
        .card { 
            border: none; 
            border-radius: 25px; 
            padding: 40px; 
            max-width: 900px; 
            margin: 40px auto; 
            background: #fdfbf7 !important; /* พื้นหลังการ์ดสีนวล */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); 
            position: relative; 
            overflow: hidden; 
        }
        
        .header { font-weight: bold; margin-bottom: 25px; color: #512da8; text-align: center; font-size: 1.8rem; }

        .goog-text-highlight { background-color: transparent !important; box-shadow: none !important; }
        .goog-tooltip, .goog-tooltip:hover { display: none !important; }
        
        .control-group { text-align: center; margin-bottom: 30px; }
        
        select { 
            padding: 15px; border-radius: 12px; border: 2px solid #a3957a !important; width: 100%; max-width: 500px; 
            font-size: 1rem; cursor: pointer; background: #fdfbf7 !important; color: #512da8;
            transition: 0.3s;
        }
        
        .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        
        .lang-btn-main { 
            background: #fdfbf7 !important; border: 2px solid #512da8; padding: 12px 25px; border-radius: 50px; 
            cursor: pointer; font-weight: bold; color: #512da8; display: flex; align-items: center; gap: 10px;
            transition: all 0.3s ease;
        }
        .lang-btn-main:hover { background: #512da8 !important; color: white; }
        
        .flag-container { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; 
            max-height: 200px; overflow-y: auto; padding: 15px; border: 2px solid #dcd3c1 !important; 
            border-radius: 18px; background: #f4f1ea !important; margin-bottom: 25px; 
        }
        
        .lang-btn { cursor: pointer; padding: 8px 12px; border: 1px solid #dcd3c1; border-radius: 8px; background: #fdfbf7 !important; font-size: 12px; display: flex; align-items: center; gap: 8px; }

        #fileContent { white-space: pre-wrap; word-wrap: break-word; color: #2c2924 !important; font-size: 1.1rem; }

        @media screen and (max-width: 600px) {
            body { padding: 8px; line-height: 1.4; }
            .card { padding: 15px; margin: 5px auto; border-radius: 15px; }
            .header { font-size: 1.4rem; margin-bottom: 15px; }
            select { padding: 10px; font-size: 0.95rem; }
            .btn-group { gap: 5px; margin-top: 10px; }
            .lang-btn-main { padding: 8px 15px; font-size: 0.9rem; }
            #fileContent { font-size: 0.95rem; }
            .flag-container { padding: 10px; gap: 5px; }
            .lang-btn { font-size: 11px; padding: 5px 8px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">📚 เลือกเล่มพระไตรปิฎก</div>
        <div class="control-group">
            <select id="book-selector" onchange="loadSelectedBook()">
                <option value="" disabled selected>-- เลือกเล่มที่ต้องการอ่าน --</option>
            </select>
            
            <div class="btn-group">
                <button class="lang-btn-main" onclick="translatePage('th')">
                    <span class="flag-icon flag-icon-th"></span> ภาษาไทย
                </button>
                <button class="lang-btn-main" onclick="translatePage('en')">
                    <span class="flag-icon flag-icon-us"></span> English
                </button>
            </div>
        </div>

        <div id="google_translate_element" style="display:none;"></div>
        <div class="flag-container" id="flagContainer"></div>

        <div style="margin-top:15px; padding:20px; border:1px solid #dcd3c1; border-radius:15px;">
            <div id="fileContent">โปรดเลือกเล่มจากรายการด้านบนเพื่ออ่านเนื้อหา...</div>

        const selector = document.getElementById('book-selector');
        bookNames.forEach((name) => {
            let option = document.createElement('option');
            option.value = name; 
            option.text = name.replace(".txt", ""); 
            selector.appendChild(option);
        });

        function loadSelectedBook() {
            const fileName = selector.value;
            const contentDiv = document.getElementById('fileContent');
            contentDiv.innerText = "กำลังโหลดข้อมูล...";
            fetch(fileName)
                .then(res => res.ok ? res.text() : Promise.reject())
                .then(data => { contentDiv.innerText = data; })
                .catch(() => { contentDiv.innerText = "ไม่พบไฟล์ " + fileName + " ในระบบ โปรดตรวจสอบว่าไฟล์อยู่ในโฟลเดอร์เดียวกับ index.html และชื่อไฟล์ตรงกันทุกตัวอักษรครับ"; });
        }

        function translatePage(lang) {
            var selectField = document.querySelector("select.goog-te-combo");
            if (selectField) { selectField.value = lang; selectField.dispatchEvent(new Event('change')); }
        }

        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'th', autoDisplay: false}, 'google_translate_element');
            setTimeout(() => {
                const select = document.querySelector("select.goog-te-combo");
                const container = document.getElementById('flagContainer');
                if(!select) return;
                const options = Array.from(select.options).slice(1);
                options.forEach(option => {
                    if (option.value === 'th' || option.value === 'en') return;
                    let flagCode = option.value.split('-').pop().toLowerCase();
                    if (flagCode === 'zh') flagCode = 'cn';
                    const btn = document.createElement('button');
                    btn.className = 'lang-btn';
                    btn.innerHTML = `<span class="flag-icon flag-icon-${flagCode}"></span> ${option.text}`;
                    btn.onclick = () => translatePage(option.value);
                    container.appendChild(btn);
                });
            }, 1000);
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
